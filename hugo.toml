# Theme defaults. A site's own config overrides these.
[module]
  [module.hugoVersion]
    extended = true
    min = "0.146.0"

[params]
  # "dark" (Radar room, the default) or "light" (Tower in daylight).
  theme = "dark"
  # Sections whose pages are shown as strips on the board.
  boardSections = ["projects"]
  [params.radar]
    # Radar scope under the board. Set enable = false to hide it.
    enable = true
    # Bays whose strips appear as contacts.
    bays = ["ACTIVE"]
  [params.handover]
    # Shift handover log beside the radar scope. Set enable = false to hide it.
    enable = true
    # How many entries (logs and amendments, newest first) it lists.
    entries = 3
    # Sections whose pages count as log entries.
    logSections = ["logs"]
    # Name in the officer line and signature; both are left out when unset.
    # officer = ""
  [params.footer]
    # The "// BY FIXBYTE" link in the footer. Set credit = false to remove it.
    credit = true

[outputs]
  home = ["html", "rss"]

[markup]
  [markup.highlight]
    # Teletype code blocks are coloured by main.css, not inline styles.
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = false
  [markup.goldmark.extensions]
    strikethrough = true

# A theme cannot switch off Hugo's default categories taxonomy; a site that
# wants tags only declares [taxonomies] itself (see the README).
[taxonomies]
  tag = "tags"
