{{- define "main" }}
<main class="wrap" id="main">
  <h1 class="page-title">{{ T "tagsTitle" }}</h1>
  <ul class="tags">
    {{- range .Pages.ByTitle }}
    <li><a class="tag" href="{{ .RelPermalink }}">{{ partial "squawk.html" .Title }}{{ upper .Title }} ({{ len .Pages }})</a></li>
    {{- end }}
  </ul>
</main>
{{- end }}
