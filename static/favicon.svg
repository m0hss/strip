<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Two strips on the board. An image can't read CSS variables, so the
       colours are copied from the radar room theme in assets/css/tokens.css. -->
  <rect width="32" height="32" rx="6" fill="#1E2124"/>
  <rect x="4" y="6" width="24" height="9" rx="1.5" fill="#E3D9BA"/>
  <rect x="4" y="6" width="3.5" height="9" rx="1.5" fill="#000" fill-opacity=".3"/>
  <rect x="4" y="17" width="24" height="9" rx="1.5" fill="#9BB8DA"/>
  <rect x="4" y="17" width="3.5" height="9" rx="1.5" fill="#000" fill-opacity=".3"/>
  <path d="M10.5 11.5h14" stroke="#C0392B" stroke-width="2" stroke-linecap="round"/>
</svg>
