# Metadata for the Hugo themes catalogue (themes.gohugo.io).
# The catalogue reads this file from the latest release tag. The supported Hugo
# versions live in hugo.toml under [module.hugoVersion].
name = "Strip"
license = "MIT"
licenselink = "https://github.com/m0hss/strip/blob/master/LICENSE"
description = "A project portfolio styled as an air-traffic-control flight progress board."
homepage = "https://github.com/m0hss/strip"
# TODO: set to the Netlify site URL once the repository is connected, before tagging a release.
# demosite = "https://<site-name>.netlify.app/"
tags = ["portfolio", "projects", "dark", "light", "responsive", "accessible", "minimal", "search"]
features = ["dark and light themes", "amendment log", "client-side search", "self-hosted fonts"]

[author]
  name = "FixByte Studio"
  homepage = "https://github.com/m0hss/strip"
